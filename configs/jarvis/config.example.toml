preset = "chat-simple"

[engine]
type = "openai"  # openai, ollama, mock
model = "gpt-4o-mini"
api_url = "https://api.openai.com/v1/chat/completions"
temperature = 0.7
max_tokens = 2048
# api_key is read from OPENAI_API_KEY env, not stored here

[telemetry]
enabled = false

[server]
host = "0.0.0.0"
port = 8000

# ── Model ladders ─────────────────────────────────────────────────────────────
# Callers ask for a PURPOSE (fast / smart / search), never a model name. Each
# ladder is tried top to bottom: a rung that times out or errors is skipped and
# put on a cooldown, so the next request does not pay the same cost again.
# Omit a ladder to use the local-first defaults in jarvis/engine/ladder.py.

[ladder.fast]        # short classification, extraction, one-line decisions
rungs = [
    { engine = "ollama", model = "qwen2.5:3b",  timeout = 20 },
    { engine = "openai", model = "gpt-4o-mini", timeout = 30 },
    { engine = "mock",   model = "mock",        timeout = 5  },
]

[ladder.smart]       # reasoning, generation, long documents
rungs = [
    { engine = "openai", model = "gpt-4o-mini", timeout = 60 },
    { engine = "ollama", model = "qwen2.5:7b",  timeout = 90 },
    { engine = "mock",   model = "mock",        timeout = 5  },
]

[ladder.search]      # grounded / tool-heavy work
rungs = [
    { engine = "openai", model = "gpt-4o-mini", timeout = 60 },
    { engine = "ollama", model = "qwen2.5:3b",  timeout = 60 },
    { engine = "mock",   model = "mock",        timeout = 5  },
]
