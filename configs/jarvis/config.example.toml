preset = "chat-simple"

[engine]
type = "openai"  # openai, ollama, mock
model = "gpt-4o-mini"
api_url = "https://api.openai.com/v1/chat/completions"
temperature = 0.7
max_tokens = 2048
# api_key is read from OPENAI_API_KEY env, not stored here

[telemetry]
enabled = false

[server]
host = "0.0.0.0"
port = 8000
