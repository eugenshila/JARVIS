name: Build Windows MSI Light (Fast)

# The quick one: server extras only, so a test installer is ready in a few
# minutes. Same script, same completeness gate and same source payload as the
# full build — only the optional Python extras differ.

on:
  push:
    tags:
      - "v*"
    # Test installers for work-in-progress branches. No release is published —
    # the release step below only runs for tags — so this just leaves a
    # downloadable MSI on the run, which is what "can we build one to test?"
    # actually needs.
    branches:
      - "arena/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (blank = read from the manifest)"
        required: false
        default: ""

jobs:
  build-light:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset --no-progress -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^v', '' }
          if ($v -notmatch '^\d+(\.\d+){0,3}$') {
            $line = Select-String -Path src/jarvis/_manifest.py -Pattern '^VERSION = "(.+)"' | Select-Object -First 1
            $v = $line.Matches[0].Groups[1].Value
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "building version $v"

      - name: Manifest is current
        # A stale manifest means the build is packaging yesterday's module list,
        # which is exactly how a new feature misses the installer.
        run: python deploy/gen_manifest.py --check

      - name: Build EXE + MSI (complete payload, gated by selftest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # A child process, so $LASTEXITCODE is the build's own exit code and
          # not whatever the last cmdlet in a pipeline happened to leave behind.
          pwsh -NoProfile -File .\deploy\windows\build_msi.ps1 -Version ${{ steps.version.outputs.version }} -Light *>&1 |
            Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The raw log is not always reachable from every network; annotations
            # are served by the API, so replay the tail as annotations too.
            Get-Content build.log -Tail 8 | ForEach-Object { Write-Host "::error::$_" }
            exit $code
          }

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.version.outputs.version }}
          path: build.log
          if-no-files-found: ignore

      - name: Prove the installed payload is complete
        shell: pwsh
        run: |
          # The exe passed its own gate during the build; this is the payload the
          # MSI carries — the part that used to be missing entirely. Everything
          # is echoed as an annotation as well, so the result is readable from
          # the API without downloading the log.
          $files = (Get-ChildItem -Recurse -File dist/payload).Count
          Write-Host "::notice::payload files inside the installer: $files"
          if ($files -lt 100) { throw "payload looks truncated ($files files)" }

          $report = (dist\jarvis.exe selftest --json | Out-String)
          $p = $report.Substring($report.IndexOf('{'), $report.LastIndexOf('}') - $report.IndexOf('{') + 1) | ConvertFrom-Json
          Write-Host "::notice::selftest: $($p.modules_ok)/$($p.modules_expected) modules importable inside jarvis.exe, complete=$($p.complete)"

          foreach ($f in Get-ChildItem dist -File) {
            Write-Host "::notice::$($f.Name) — $([math]::Round($f.Length/1MB,1)) MB"
          }

          # A last look inside the MSI itself: the file table is the only proof
          # that the payload actually made it into the package rather than just
          # onto the build agent's disk.
          $msi = (Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT COUNT(*) FROM File"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $count = $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, 1)
          Write-Host "::notice::files packaged inside the MSI: $count"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-light-${{ steps.version.outputs.version }}
          path: |
            dist/*.msi
            dist/*.zip
            dist/jarvis.exe
            dist/jarvis-desktop.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
