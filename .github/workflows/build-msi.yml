name: Build Windows MSI + EXE (Full)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 0.1.0)"
        required: false
        default: "0.1.0"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset --no-progress -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install deps (full, may be heavy)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.10.0
          python -m pip install -e .[server,memory,tools-search]
          # Note: [all] includes vllm which doesn't work on Windows, so use subset

      - name: Build EXE (full)
        run: |
          python -m PyInstaller --onedir --name jarvis --console src/jarvis/cli/main.py --collect-all jarvis --add-data "configs;configs" --hidden-import faiss --hidden-import sentence_transformers --hidden-import jarvis.memory.vector_store --hidden-import jarvis.tools.search_tools
          dir dist

      - name: Build MSI (simple robust method)
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}".TrimStart('v') }
          if (-not $version) { $version = "0.1.0" }
          Write-Host "Building MSI version $version"
          # Use simple WXS without heat for reliability (heat fails with many files)
          $wxs = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="JARVIS - Personal AI" Language="1033" Version="$version" Manufacturer="JARVIS" UpgradeCode="a1b2c3d4-e5f6-7890-abcd-ef1234567890">
              <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" Description="JARVIS Local-first Personal AI" />
              <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="ProductFeature" Title="JARVIS" Level="1">
                <ComponentRef Id="MainExecutable" />
                <ComponentRef Id="PathEnv" />
                <ComponentRef Id="StartMenuShortcut" />
              </Feature>
              <UIRef Id="WixUI_InstallDir" />
              <Property Id="WIXUI_INSTALLDIR" Value="INSTALLFOLDER" />
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLFOLDER" Name="JARVIS">
                    <Component Id="MainExecutable" Guid="*">
                      <File Id="JarvisExe" Source="dist\jarvis\jarvis.exe" KeyPath="yes" />
                    </Component>
                  </Directory>
                </Directory>
                <Directory Id="ProgramMenuFolder">
                  <Directory Id="ApplicationProgramsFolder" Name="JARVIS">
                    <Component Id="StartMenuShortcut" Guid="*">
                      <Shortcut Id="AppShortcut" Name="JARVIS" Target="[INSTALLFOLDER]jarvis.exe" WorkingDirectory="INSTALLFOLDER" />
                      <RemoveFolder Id="CleanUp" Directory="ApplicationProgramsFolder" On="uninstall" />
                      <RegistryValue Root="HKCU" Key="Software\JARVIS" Name="installed" Type="integer" Value="1" KeyPath="yes" />
                    </Component>
                  </Directory>
                </Directory>
              </Directory>
              <DirectoryRef Id="TARGETDIR">
                <Component Id="PathEnv" Guid="*">
                  <Environment Id="PATH" Name="PATH" Value="[INSTALLFOLDER]" Permanent="no" Part="last" Action="set" System="yes" />
                  <RegistryValue Root="HKCU" Key="Software\JARVIS" Name="path" Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </DirectoryRef>
            </Product>
          </Wix>
          "@
          $wxs | Out-File -FilePath "simple_full.wxs" -Encoding utf8
          candle.exe simple_full.wxs -o simple_full.wixobj -arch x64
          light.exe simple_full.wixobj -o "dist/JARVIS-$version-x64.msi" -ext WixUIExtension -cultures:en-us
          if ($LASTEXITCODE -ne 0) {
            Write-Host "First light failed, trying without UI ext"
            light.exe simple_full.wixobj -o "dist/JARVIS-$version-x64.msi" -cultures:en-us
          }
          dir dist

      - name: Create portable ZIP
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version) { $version = "0.1.0" }
          Compress-Archive -Path dist/jarvis/* -DestinationPath "dist/JARVIS-$version-portable.zip" -Force
          Compress-Archive -Path dist/jarvis/* -DestinationPath "dist/JARVIS-portable.zip" -Force
          dir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: |
            dist/*.msi
            dist/*.zip
            dist/jarvis/jarvis.exe
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
