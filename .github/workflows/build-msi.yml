name: Build Windows MSI + EXE (Full)

# The full one: memory (FAISS, sentence-transformers) and search extras bundled,
# so the installed assistant has vector memory and web search without a pip
# install on the target machine. Slower to build; identical packaging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (blank = read from the manifest)"
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 20 (the holographic interface ships as source)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset --no-progress -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^v', '' }
          if ($v -notmatch '^\d+(\.\d+){0,3}$') {
            $line = Select-String -Path src/jarvis/_manifest.py -Pattern '^VERSION = "(.+)"' | Select-Object -First 1
            $v = $line.Matches[0].Groups[1].Value
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "building version $v"

      - name: Manifest is current
        run: python deploy/gen_manifest.py --check

      - name: The web interface still builds
        # It ships as source, so a broken face would only be discovered by the
        # person who installed it. Cheap to catch here.
        shell: pwsh
        run: |
          cd web
          npm install --no-audit --no-fund --ignore-scripts
          npm run build

      - name: Build EXE + MSI (complete payload, gated by selftest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # A child process, so $LASTEXITCODE is the build's own exit code and
          # not whatever the last cmdlet in a pipeline happened to leave behind.
          pwsh -NoProfile -File .\deploy\windows\build_msi.ps1 -Version ${{ steps.version.outputs.version }} *>&1 |
            Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The raw log is not always reachable from every network; annotations
            # are served by the API, so replay the tail as annotations too.
            Get-Content build.log -Tail 8 | ForEach-Object { Write-Host "::error::$_" }
            exit $code
          }

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.version.outputs.version }}
          path: build.log
          if-no-files-found: ignore

      - name: Report what the installer carries
        shell: pwsh
        run: |
          $files = (Get-ChildItem -Recurse -File dist/payload).Count
          Write-Host "::notice::payload files inside the installer: $files"
          if ($files -lt 100) { throw "payload looks truncated ($files files)" }
          dist\jarvis.exe selftest
          foreach ($f in Get-ChildItem dist -File) {
            Write-Host "::notice::$($f.Name) — $([math]::Round($f.Length/1MB,1)) MB"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-full-${{ steps.version.outputs.version }}
          path: |
            dist/*.msi
            dist/*.zip
            dist/jarvis.exe
            dist/jarvis-desktop.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
