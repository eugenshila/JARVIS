name: JARVIS GitHub Pages Test
# Publishes the JARVIS holographic HUD dashboard to GitHub Pages.

on:
  workflow_dispatch:
  push:
    branches: [main, arena/01a0e6fe-jarvis]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build JARVIS HUD
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --mode pages

      - name: Verify Pages artifact
        shell: bash
        run: |
          test -f frontend/dist/index.html
          echo "index.html found at frontend/dist/index.html"
          find frontend/dist -maxdepth 2 -type f | sort | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy JARVIS HUD
        id: deployment
        uses: actions/deploy-pages@v4
