name: Windows JARVIS MSI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "frontend/**"
      - "configs/**"
      - "pyproject.toml"
      - "deploy/windows/**"
      - ".github/workflows/windows-msi.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare WiX
        shell: powershell
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if ($null -eq $candle) {
            $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object { Test-Path (Join-Path $_ "candle.exe") } |
              Select-Object -First 1
            if ($wixBin) {
              Add-Content $env:GITHUB_PATH $wixBin
            } else {
              choco install wixtoolset -y --no-progress
            }
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object { Test-Path (Join-Path $_ "candle.exe") } |
              Select-Object -First 1
            if ($wixBin) { Add-Content $env:GITHUB_PATH $wixBin }
          }
          where.exe candle.exe
          where.exe light.exe
      - name: Build MSI
        shell: powershell
        run: .\deploy\windows\build_msi.ps1 -Version 0.2.0
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-0.2.0
          path: |
            dist/JARVIS-0.2.0-x64.msi
            dist/JARVIS-0.2.0-portable.zip
          if-no-files-found: error
