name: Windows JARVIS MSI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional MSI version override (for example 0.2.1)
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "frontend/**"
      - "configs/**"
      - "pyproject.toml"
      - "deploy/windows/**"
      - ".github/workflows/windows-msi.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "frontend/**"
      - "configs/**"
      - "pyproject.toml"
      - "deploy/windows/**"
      - ".github/workflows/windows-msi.yml"

# The manual replacement build also publishes the tested MSI as a GitHub
# Release. Pull requests and main pushes still only upload CI artifacts.
permissions:
  contents: write

jobs:
  build-windows:
    name: Build and smoke-test canonical MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve product version
        id: version
        shell: pwsh
        run: |
          $override = "${{ inputs.version }}"
          $content = Get-Content pyproject.toml -Raw
          if ($content -notmatch '(?m)^version\s*=\s*"(?<version>\d+\.\d+\.\d+)"') {
            throw "Could not read project version from pyproject.toml"
          }
          $version = if ($override) { $override } else { $Matches.version }
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "Invalid MSI version: $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building JARVIS $version"

      - name: Prepare WiX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wixBin = $null
          $roots = @(
            'C:\Program Files (x86)\WiX Toolset v3.14\bin',
            'C:\Program Files (x86)\WiX Toolset v3.11\bin',
            'C:\Program Files\WiX Toolset v3.14\bin',
            'C:\Program Files\WiX Toolset v3.11\bin'
          )
          foreach ($candidate in $roots) {
            if (Test-Path (Join-Path $candidate 'candle.exe')) { $wixBin = $candidate; break }
          }
          if (-not $wixBin) {
            choco install wixtoolset --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install WiX Toolset." }
            foreach ($candidate in $roots) {
              if (Test-Path (Join-Path $candidate 'candle.exe')) { $wixBin = $candidate; break }
            }
          }
          if (-not $wixBin) {
            $wixBin = (Get-ChildItem 'C:\Program Files (x86)' -Filter candle.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'WiX Toolset' } |
              Select-Object -First 1 |
              ForEach-Object { $_.DirectoryName })
          }
          if (-not $wixBin -or -not (Test-Path (Join-Path $wixBin 'light.exe'))) {
            throw 'WiX candle.exe and light.exe were not found.'
          }
          $env:PATH = "$wixBin;$env:PATH"
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Get-Command candle.exe
          Get-Command light.exe

      - name: Download neural JARVIS voice assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path voice, piper | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/jgkawell/jarvis/resolve/main/en/en_GB/jarvis/medium/jarvis-medium.onnx" -OutFile "voice/jarvis-medium.onnx"
          Invoke-WebRequest -Uri "https://huggingface.co/jgkawell/jarvis/resolve/main/en/en_GB/jarvis/medium/jarvis-medium.onnx.json" -OutFile "voice/jarvis-medium.onnx.json"
          $piperArchive = Join-Path $env:RUNNER_TEMP 'piper_windows_amd64.zip'
          Invoke-WebRequest -Uri "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile $piperArchive
          Expand-Archive -Path $piperArchive -DestinationPath piper -Force
          $piperExe = Get-ChildItem piper -Filter piper.exe -Recurse | Select-Object -First 1
          if (-not $piperExe) { throw 'Piper executable was not found after extraction.' }
          Copy-Item (Join-Path $piperExe.Directory.FullName '*') piper -Recurse -Force
          if (-not (Test-Path 'voice/jarvis-medium.onnx') -or -not (Test-Path 'piper/piper.exe')) {
            throw 'Neural voice assets are incomplete.'
          }
          Write-Host 'Bundled JARVIS neural voice and Piper runtime.'

      - name: Build MSI and portable ZIP
        shell: pwsh
        run: .\deploy\windows\build_msi.ps1 -Version "${{ steps.version.outputs.version }}" -OneFile

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.msi', '.zip' }
          if (-not $artifacts) { throw "No release artifacts found" }
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Install and uninstall smoke test
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $msi = (Resolve-Path "dist/JARVIS-$version-x64.msi").Path
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart')
          if ($install.ExitCode -ne 0) { throw "MSI install failed with exit code $($install.ExitCode)" }
          $installDir = Join-Path $env:ProgramFiles 'JARVIS SHILATECH'
          foreach ($file in @('jarvis.exe', 'jarvis-desktop.exe', 'config.example.toml')) {
            if (-not (Test-Path (Join-Path $installDir $file))) { throw "Installed file missing: $file" }
          }
          $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart')
          if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($uninstall.ExitCode)" }
          if (Test-Path (Join-Path $installDir 'jarvis-desktop.exe')) { throw "Uninstall left jarvis-desktop.exe behind" }

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/JARVIS-${{ steps.version.outputs.version }}-x64.msi
            dist/JARVIS-${{ steps.version.outputs.version }}-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish replacement GitHub Release
        # TEMPORARY: also publish from this fix branch's PR build because
        # workflow_dispatch is unavailable in the current automation session.
        # Reverted to manual-only immediately after v0.2.1 is published.
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'arena/01a0ecfc-jarvis')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: JARVIS ${{ steps.version.outputs.version }}
          body: |
            Replacement Windows installer for JARVIS ${{ steps.version.outputs.version }}.

            This build includes the Uvicorn formatter fix plus the bundled British
            JARVIS neural voice, Piper runtime, and offline Whisper wake/command model.
            SHA-256 checksums are included alongside the MSI.
          files: |
            dist/JARVIS-${{ steps.version.outputs.version }}-x64.msi
            dist/JARVIS-${{ steps.version.outputs.version }}-portable.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
