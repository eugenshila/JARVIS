name: Windows JARVIS MSI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "frontend/**"
      - "configs/**"
      - "pyproject.toml"
      - "deploy/windows/**"
      - ".github/workflows/windows-msi.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare WiX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wixBin = $null
          $roots = @(
            'C:\Program Files (x86)\WiX Toolset v3.14\bin',
            'C:\Program Files (x86)\WiX Toolset v3.11\bin',
            'C:\Program Files\WiX Toolset v3.14\bin',
            'C:\Program Files\WiX Toolset v3.11\bin'
          )
          foreach ($candidate in $roots) {
            if (Test-Path (Join-Path $candidate 'candle.exe')) { $wixBin = $candidate; break }
          }
          if (-not $wixBin) {
            choco install wixtoolset --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install WiX Toolset." }
            foreach ($candidate in $roots) {
              if (Test-Path (Join-Path $candidate 'candle.exe')) { $wixBin = $candidate; break }
            }
          }
          if (-not $wixBin) {
            $wixBin = (Get-ChildItem 'C:\Program Files (x86)' -Filter candle.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'WiX Toolset' } |
              Select-Object -First 1 |
              ForEach-Object { $_.DirectoryName })
          }
          if (-not $wixBin -or -not (Test-Path (Join-Path $wixBin 'light.exe'))) {
            throw 'WiX candle.exe and light.exe were not found.'
          }
          # GITHUB_PATH affects later steps only; update this process too so
          # validation and the build script see the tools immediately.
          $env:PATH = "$wixBin;$env:PATH"
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Get-Command candle.exe
          Get-Command light.exe
      - name: Build MSI
        shell: powershell
        run: .\deploy\windows\build_msi.ps1 -Version 0.2.0 -OneFile
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-0.2.0
          path: |
            dist/JARVIS-0.2.0-x64.msi
            dist/JARVIS-0.2.0-portable.zip
          if-no-files-found: error
