name: Build SHILATECH JARVIS HUD MSI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hud-msi.yml'
      - 'src/jarvis/**'
      - 'frontend/**'
      - 'deploy/windows/hud.wxs'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build HUD
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python packaging requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[voice] pyinstaller

      - name: Download JARVIS neural voice assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path voice, piper | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/jgkawell/jarvis/resolve/main/en/en_GB/jarvis/medium/jarvis-medium.onnx" -OutFile "voice/jarvis-medium.onnx"
          Invoke-WebRequest -Uri "https://huggingface.co/jgkawell/jarvis/resolve/main/en/en_GB/jarvis/medium/jarvis-medium.onnx.json" -OutFile "voice/jarvis-medium.onnx.json"
          Invoke-WebRequest -Uri "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile "$env:TEMP\\piper_windows_amd64.zip"
          Expand-Archive -Path "$env:TEMP\\piper_windows_amd64.zip" -DestinationPath piper -Force
          $piperExe = Get-ChildItem piper -Filter piper.exe -Recurse | Select-Object -First 1
          if (-not $piperExe) { throw "Piper executable was not found after extraction." }
          $piperRoot = $piperExe.Directory.FullName
          Copy-Item "$piperRoot\\*" piper -Recurse -Force
          Write-Host "JARVIS neural voice and Piper runtime ready."


      - name: Package local API, HUD, and hands-free companion
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name JARVIS-HUD --icon assets/icon.ico --add-data "frontend/dist;frontend/dist" --add-data "voice;voice" --add-data "piper;piper" --collect-all jarvis --collect-all sounddevice --collect-all faster_whisper --collect-all uvicorn src/jarvis/cli/hud_launcher.py
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist/JARVIS-HUD.exe)) { throw "HUD EXE build failed" }

      - name: Install WiX v3
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
          $candle = @(
            'C:\Program Files (x86)\WiX Toolset v3.14\bin\candle.exe',
            'C:\Program Files (x86)\WiX Toolset v3.11\bin\candle.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $candle) {
            $candle = Get-ChildItem 'C:\Program Files (x86)' -Filter candle.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'WiX Toolset' } | Select-Object -First 1
          }
          if (-not $candle) { throw "WiX tools missing" }
          (Split-Path $candle) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          candle.exe -arch x64 deploy/windows/hud.wxs -o dist/hud.wixobj
          if ($LASTEXITCODE -ne 0) { throw "WiX compile failed" }
          light.exe dist/hud.wixobj -ext WixUIExtension -o dist/SHILATECH-JARVIS-0.3.0-x64.msi
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist/SHILATECH-JARVIS-0.3.0-x64.msi)) { throw "MSI link failed" }

      - name: Install and smoke test MSI
        shell: pwsh
        run: |
          $msi = (Resolve-Path dist/SHILATECH-JARVIS-0.3.0-x64.msi).Path
          $result = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', 'MSIINSTALLPERUSER=1')
          if ($result.ExitCode -ne 0) { throw "MSI install failed: $($result.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'SHILATECH JARVIS\JARVIS-HUD.exe'
          if (-not (Test-Path $exe)) { throw "Installed HUD EXE missing" }
          $process = Start-Process $exe -PassThru
          try {
            $healthy = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match 'JARVIS') { $healthy = $true; break }
              } catch { }
            }
            if (-not $healthy) {
              $log = Join-Path $env:LOCALAPPDATA 'JARVIS\hud.log'
              if (Test-Path $log) { Get-Content $log | Write-Host }
              Write-Host "Process exited: $($process.HasExited)"
              try { Write-Host "API response: $((Invoke-WebRequest -Uri http://127.0.0.1:8765/hud/status -UseBasicParsing -TimeoutSec 2).Content)" } catch { Write-Host "API not reachable: $_" }
              throw "Installed HUD did not serve its interface"
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SHILATECH-JARVIS-0.3.0-Windows
          path: |
            dist/SHILATECH-JARVIS-0.3.0-x64.msi
            dist/JARVIS-HUD.exe
          if-no-files-found: error

# Build verification: package the exact checked-in circular HUD and startup launcher.
