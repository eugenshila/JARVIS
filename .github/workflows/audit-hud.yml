name: Audit SHILATECH JARVIS HUD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/jarvis/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - '.github/workflows/audit-hud.yml'

jobs:
  audit:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install runtime and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[voice] pyinstaller

      - name: Download voice assets for runtime audit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path voice, piper | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/jgkawell/jarvis/resolve/main/en/en_GB/jarvis/medium/jarvis-medium.onnx" -OutFile "voice/jarvis-medium.onnx"
          Invoke-WebRequest -Uri "https://huggingface.co/jgkawell/jarvis/resolve/main/en/en_GB/jarvis/medium/jarvis-medium.onnx.json" -OutFile "voice/jarvis-medium.onnx.json"
          Invoke-WebRequest -Uri "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile "$env:TEMP\piper_windows_amd64.zip"
          Expand-Archive -Path "$env:TEMP\piper_windows_amd64.zip" -DestinationPath piper -Force
          $piperExe = Get-ChildItem piper -Filter piper.exe -Recurse | Select-Object -First 1
          if (-not $piperExe) { throw "Piper executable was not found." }
          Copy-Item "$($piperExe.Directory.FullName)\*" piper -Recurse -Force

      - name: Static Python import audit
        shell: pwsh
        run: |
          python -c "from jarvis.server.api import app; from jarvis.voice import piper_available; from jarvis.startup.hud_companion import DoubleClap; print('API import OK'); print('Piper source availability:', piper_available()); print('DoubleClap import OK')"

      - name: Package debug HUD executable (no MSI)
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name JARVIS-HUD-AUDIT --icon assets/icon.ico --add-data "frontend/dist;frontend/dist" --add-data "voice;voice" --add-data "piper;piper" --collect-all jarvis --collect-all sounddevice --collect-all faster_whisper --collect-all uvicorn src/jarvis/cli/hud_launcher.py
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist/JARVIS-HUD-AUDIT.exe)) { throw "Debug HUD executable build failed." }

      - name: Start packaged HUD for browser audit
        shell: pwsh
        run: |
          $env:JARVIS_DISABLE_HANDS_FREE = "1"
          $process = Start-Process (Resolve-Path dist/JARVIS-HUD-AUDIT.exe).Path -PassThru
          "PID=$($process.Id)" | Out-File hud-process.txt
          $healthy = $false
          for ($i=0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try {
              $response = Invoke-WebRequest -Uri http://127.0.0.1:8765/health -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $healthy = $true; break }
            } catch { }
          }
          if (-not $healthy) {
            if (Test-Path "$env:LOCALAPPDATA\JARVIS\hud.log") { Get-Content "$env:LOCALAPPDATA\JARVIS\hud.log" | Write-Host }
            throw "Packaged HUD API did not become ready."
          }

      - name: Browser runtime audit
        shell: pwsh
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          @'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const errors = [];
          const consoleErrors = [];
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });

          page.on("pageerror", error => errors.push(String(error.stack || error)));
          page.on("console", msg => {
            if (msg.type() === "error") consoleErrors.push(msg.text());
          });
          page.on("requestfailed", req => errors.push("REQUEST FAILED: " + req.url() + " :: " + (req.failure()?.errorText || "")));

          const response = await page.goto("http://127.0.0.1:8765/", { waitUntil: "domcontentloaded", timeout: 15000 });
          if (!response || response.status() !== 200) throw new Error("HUD root did not return HTTP 200.");

          await page.waitForSelector("canvas", { state: "visible", timeout: 10000 });
          await page.getByText("JARVIS", { exact: true }).first().waitFor({ state: "visible", timeout: 10000 });

          const bodyText = await page.locator("body").innerText();
          if (!bodyText.includes("INTERACTIVE REACTOR INTERFACE")) throw new Error("Circular HUD text did not render.");

          await page.screenshot({ path: "hud-audit.png", fullPage: true });
          fs.writeFileSync("hud-browser-errors.txt", [...errors, ...consoleErrors].join("\n"), "utf8");

          if (errors.length || consoleErrors.length) {
            throw new Error("Browser runtime errors detected:\n" + [...errors, ...consoleErrors].join("\n"));
          }

          await browser.close();
          console.log("BROWSER HUD AUDIT PASSED");
          '@ | Set-Content hud-audit.mjs -Encoding UTF8
          node hud-audit.mjs

      - name: API endpoint audit
        shell: pwsh
        run: |
          $root = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($root.Content -notmatch 'JARVIS') { throw "HUD HTML does not contain JARVIS." }
          $status = Invoke-RestMethod http://127.0.0.1:8765/hud/status
          $voice = Invoke-RestMethod http://127.0.0.1:8765/hud/voice-status
          Write-Host "HUD status:" ($status | ConvertTo-Json -Compress)
          Write-Host "Voice status:" ($voice | ConvertTo-Json -Compress)

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:LOCALAPPDATA\JARVIS\hud.log") { Copy-Item "$env:LOCALAPPDATA\JARVIS\hud.log" hud.log -Force }
          if (Test-Path "$env:LOCALAPPDATA\JARVIS\voice_status.json") { Copy-Item "$env:LOCALAPPDATA\JARVIS\voice_status.json" voice_status.json -Force }
          Get-Process JARVIS-HUD-AUDIT -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-HUD-audit-diagnostics
          path: |
            hud-audit.png
            hud-browser-errors.txt
            hud.log
            voice_status.json
            hud-process.txt
          if-no-files-found: ignore
